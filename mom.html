<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мама, что дальше?</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="screen">

  <!-- ===== ШАПКА ===== -->
  <header class="header">
    <!-- Персонаж (позиционирован абсолютно, перекрывает правую часть) -->
    <img class="char-img" src="assets/01_hero_mom.png" alt="">

    <!-- Топ-бар -->
    <div class="topbar">
      <img class="logo-img" src="assets/02_mama_logo.png" alt="Мама, что дальше?">
      <div class="topbar-actions">
        <button class="icon-btn" onclick="stub('Уведомления')" aria-label="Уведомления">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="white">
            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
          </svg>
          <span class="badge">3</span>
        </button>
        <button class="icon-btn" onclick="stub('Профиль')" aria-label="Профиль">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="white">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Текст героя (левая половина) -->
    <div class="hero">
      <div class="hero-text">
        <h1 class="greeting">Привет,<br>Анастасия!&nbsp;<span class="h">💜</span></h1>
        <button class="week-pill" onclick="stub('Неделя беременности')">
          <strong>24&nbsp;неделя</strong>&nbsp;беременности
          <svg viewBox="0 0 7 12" width="6" height="10" fill="none" style="margin-left:6px;flex-shrink:0">
            <path d="M1 1l5 5-5 5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="hero-sub">Мы рядом и подскажем,<br>что важно сделать сейчас&nbsp;💜</p>
      </div>
    </div>
  </header>

  <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
  <div class="content">

    <!-- Карточка недели -->
    <button class="weekly" onclick="stub('Что важно на этой неделе?')">
      <div class="weekly-icon">
        <img src="assets/icon_calendar.png" width="36" height="36" alt="" style="object-fit:contain;display:block;">
      </div>
      <div class="weekly-body">
        <div class="weekly-title">Что важно<br>на этой неделе?</div>
        <div class="weekly-sub">3 задачи на сегодня</div>
      </div>
      <svg class="chev" viewBox="0 0 7 12" width="7" height="12" fill="none">
        <path d="M1 1l5 5-5 5" stroke="#9B6ECC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- Сетка 2×4 -->
    <div class="grid">

      <button class="card" onclick="stub('Беременность по неделям')">
        <div class="ci"><img src="assets/04_icon_baby.png" alt=""></div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Беременность<br>по неделям</span>
            <svg class="chev sm" viewBox="0 0 7 12" width="6" height="10" fill="none"><path d="M1 1l5 5-5 5" stroke="#C880B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span class="cs">Развитие, изменения<br>в тебе, рекомендации</span>
        </div>
      </button>

      <button class="card" onclick="stub('Дневник беременности')">
        <div class="ci"><img src="assets/05_icon_diary.png" alt=""></div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Дневник<br>беременности</span>
            <svg class="chev sm" viewBox="0 0 7 12" width="6" height="10" fill="none"><path d="M1 1l5 5-5 5" stroke="#C880B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span class="cs">Записи, эмоции, фото<br>и важные события</span>
        </div>
      </button>

      <button class="card" onclick="stub('Обследования')">
        <div class="ci"><img src="assets/06_icon_medical.png" alt=""></div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Обследования</span>
            <svg class="chev sm" viewBox="0 0 7 12" width="6" height="10" fill="none"><path d="M1 1l5 5-5 5" stroke="#72C4D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span class="cs">Анализы, УЗИ,<br>приёмы по сроку</span>
        </div>
      </button>

      <button class="card" onclick="stub('Список покупок')">
        <div class="ci"><img src="assets/07_icon_shopping_bag.png" alt=""></div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Список покупок</span>
            <svg class="chev sm" viewBox="0 0 7 12" width="6" height="10" fill="none"><path d="M1 1l5 5-5 5" stroke="#C880B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span class="cs">Всё необходимое<br>для первых месяцев</span>
        </div>
      </button>

      <button class="card" onclick="stub('Подготовка к родам')">
        <div class="ci"><img src="assets/08_icon_birth_bag.png" alt=""></div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Подготовка<br>к родам</span>
            <svg class="chev sm" viewBox="0 0 7 12" width="6" height="10" fill="none"><path d="M1 1l5 5-5 5" stroke="#C8A070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span class="cs">Роддом, документы,<br>сумка, план родов</span>
        </div>
      </button>

      <button class="card" onclick="stub('Полезные рекомендации')">
        <div class="ci"><img src="assets/09_icon_books.png" alt=""></div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Полезные<br>рекомендации</span>
            <svg class="chev sm" viewBox="0 0 7 12" width="6" height="10" fill="none"><path d="M1 1l5 5-5 5" stroke="#9080C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span class="cs">Питание, самочувствие,<br>уход за собой и другое</span>
        </div>
      </button>

      <button class="card" onclick="stub('Ассистент')">
        <div class="ci"><img src="assets/10_icon_robot.png" alt=""></div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Ассистент</span>
            <svg class="chev sm" viewBox="0 0 7 12" width="6" height="10" fill="none"><path d="M1 1l5 5-5 5" stroke="#78B8E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span class="cs">Задай любой вопрос<br>о беременности</span>
        </div>
      </button>

      <button class="card" onclick="stub('Профиль')">
        <div class="ci"><img src="assets/11_icon_profile.png" alt=""></div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Профиль</span>
            <svg class="chev sm" viewBox="0 0 7 12" width="6" height="10" fill="none"><path d="M1 1l5 5-5 5" stroke="#A080C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span class="cs">Твои данные,<br>настройки, подписка</span>
        </div>
      </button>

    </div>

    <!-- Баннер «Малыш родился!» -->
    <button class="baby-banner" onclick="stub('Малыш родился!')">
      <img class="baby-img" src="assets/03_baby_banner.png" alt="">
      <div class="baby-text">
        <div class="baby-title">Малыш родился!</div>
        <div class="baby-sub">Расскажи нам о своём малыше,<br>чтобы получить новый план заботы</div>
      </div>
      <div class="baby-btn">
        <svg viewBox="0 0 7 12" width="7" height="12" fill="none">
          <path d="M1 1l5 5-5 5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </button>

    <div class="spacer"></div>
  </div>

  <!-- ===== НИЖНЯЯ НАВИГАЦИЯ ===== -->
  <nav class="bottom-nav">
    <button class="tab active">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span>Главная</span>
    </button>
    <button class="tab" onclick="stub('О проекте')">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
      </svg>
      <span>О проекте</span>
    </button>
    <button class="tab" onclick="stub('Служба заботы')">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M12 1C5.93 1 1 5.93 1 12v4c0 1.1.9 2 2 2h1c1.1 0 2-.9 2-2v-3c0-1.1-.9-2-2-2H3.07C3.56 7.19 7.38 4 12 4s8.44 3.19 8.93 7H20c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h1c1.1 0 2-.9 2-2v-4c0-6.07-4.93-11-11-11z"/>
      </svg>
      <span>Служба заботы</span>
    </button>
  </nav>

</main>

<!-- ===== ПОПАП-ЗАГЛУШКА ===== -->
<div class="overlay" id="overlay" onclick="closeStub()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-icon">🚧</div>
    <div class="modal-title">Раздел в разработке</div>
    <div class="modal-text" id="modalText"></div>
    <button class="modal-btn" onclick="closeStub()">Понятно</button>
  </div>
</div>

<script>
  if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  function stub(section) {
    if (window.Telegram?.WebApp?.showAlert) {
      window.Telegram.WebApp.showAlert('Раздел «' + section + '» скоро будет готов 🚧');
    } else {
      document.getElementById('modalText').textContent = '«' + section + '» скоро будет готов';
      document.getElementById('overlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
  }

  function closeStub() {
    document.getElementById('overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeStub(); });
</script>
</body>
</html>
