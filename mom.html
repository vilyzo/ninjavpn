<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мама, что дальше? — Главная</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Caveat:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main class="screen">

  <div class="scroll-body">

    <div class="top-actions">
      <button class="round-btn" id="btn-notifications" aria-label="Уведомления">
        <img src="assets_mom/svg/ic-bell.svg" alt="">
        <img class="dot" src="assets_mom/svg/ic-badge-dot.svg" alt="" aria-hidden="true">
      </button>
      <button class="round-btn" id="btn-profile" aria-label="Профиль">
        <img src="assets_mom/svg/ic-user.svg" alt="">
      </button>
    </div>

    <section class="hero">
      <img class="hero__mom" src="assets_mom/png/hero-mom@2x.png" alt="">
      <div class="hero__hand" aria-hidden="true">Ты<br>всё<br>можешь<img src="assets_mom/svg/ic-heart-outline.svg" alt=""></div>

      <img class="logo" src="assets_mom/png/logo-cloud@2x.png" alt="Мама, что дальше?">
      <h1 class="greet">Привет,<br><span data-user-name>Анастасия!</span><img src="assets_mom/svg/ic-heart.svg" alt=""></h1>
      <button class="week-pill" id="btn-week">
        <b data-week>24 неделя</b> беременности
        <img src="assets_mom/svg/ic-chevron-right.svg" alt="">
      </button>
      <p class="lead">Мы рядом и подскажем,<br>что важно сделать сейчас<img src="assets_mom/svg/ic-heart-violet.svg" alt=""></p>
    </section>

    <button class="focus" id="btn-focus">
      <img class="focus__icon" src="assets_mom/svg/ic-calendar-tile.svg" alt="">
      <span class="focus__text">
        <span class="focus__title">Что важно<br>на этой неделе?</span>
        <span class="focus__sub" data-tasks>3 задачи на сегодня</span>
      </span>
      <span class="chev-btn"><img src="assets_mom/svg/ic-chevron-right.svg" alt=""></span>
    </button>

    <nav class="grid" aria-label="Разделы">
      <button class="card" data-section="pregnancy">
        <span class="card__art card__art--pink"><img src="assets_mom/png/ill-embryo@2x.png" alt=""></span>
        <span class="card__body"><span class="card__title">Беременность<br>по неделям</span><span class="card__sub">Развитие, изменения в тебе, рекомендации</span></span>
        <img class="chev" src="assets_mom/svg/ic-chevron-right.svg" alt="">
      </button>
      <button class="card" data-section="diary">
        <span class="card__art card__art--pink"><img src="assets_mom/png/ill-diary@2x.png" alt=""></span>
        <span class="card__body"><span class="card__title">Дневник<br>беременности</span><span class="card__sub">Записи, эмоции, фото и важные события</span></span>
        <img class="chev" src="assets_mom/svg/ic-chevron-right.svg" alt="">
      </button>
      <button class="card" data-section="checkup">
        <span class="card__art card__art--violet"><img src="assets_mom/png/ill-checkup@2x.png" alt=""></span>
        <span class="card__body"><span class="card__title">Обследования</span><span class="card__sub">Анализы, УЗИ, приёмы по сроку</span></span>
        <img class="chev" src="assets_mom/svg/ic-chevron-right.svg" alt="">
      </button>
      <button class="card" data-section="shopping">
        <span class="card__art card__art--pink"><img src="assets_mom/png/ill-shopping-bag@2x.png" alt=""></span>
        <span class="card__body"><span class="card__title">Список покупок</span><span class="card__sub">Всё необходимое для первых месяцев</span></span>
        <img class="chev" src="assets_mom/svg/ic-chevron-right.svg" alt="">
      </button>
      <button class="card" data-section="birth">
        <span class="card__art card__art--pink"><img src="assets_mom/png/ill-hospital-bag@2x.png" alt=""></span>
        <span class="card__body"><span class="card__title">Подготовка<br>к родам</span><span class="card__sub">Роддом, документы, сумка, план родов</span></span>
        <img class="chev" src="assets_mom/svg/ic-chevron-right.svg" alt="">
      </button>
      <button class="card" data-section="tips">
        <span class="card__art card__art--violet"><img src="assets_mom/png/ill-books@2x.png" alt=""></span>
        <span class="card__body"><span class="card__title">Полезные<br>рекомендации</span><span class="card__sub">Питание, самочувствие, уход за собой и другое</span></span>
        <img class="chev" src="assets_mom/svg/ic-chevron-right.svg" alt="">
      </button>
      <button class="card" data-section="assistant">
        <span class="card__art card__art--violet"><img src="assets_mom/png/ill-assistant@2x.png" alt=""></span>
        <span class="card__body"><span class="card__title">Ассистент</span><span class="card__sub">Задай любой вопрос о беременности</span></span>
        <img class="chev" src="assets_mom/svg/ic-chevron-right.svg" alt="">
      </button>
      <button class="card" data-section="profile">
        <span class="card__art card__art--violet"><img src="assets_mom/png/ill-profile@2x.png" alt=""></span>
        <span class="card__body"><span class="card__title">Профиль</span><span class="card__sub">Твои данные, настройки, подписка</span></span>
        <img class="chev" src="assets_mom/svg/ic-chevron-right.svg" alt="">
      </button>
    </nav>

    <button class="baby" id="btn-baby">
      <img class="deco deco--1" src="assets_mom/svg/ic-heart-soft.svg" alt="">
      <img class="deco deco--2" src="assets_mom/svg/ic-heart-soft.svg" alt="">
      <img class="baby__art" src="assets_mom/png/ill-newborn@2x.png" alt="">
      <span class="baby__text">
        <span class="baby__title">Малыш родился!</span>
        <span class="baby__sub">Расскажи нам о своём малыше,<br>чтобы получить новый план заботы</span>
      </span>
      <span class="chev-btn"><img src="assets_mom/svg/ic-chevron-right.svg" alt=""></span>
    </button>

  </div><!-- /.scroll-body -->

  <nav class="tabbar" aria-label="Навигация">
    <button class="tab" aria-current="page" data-tab="home"><img src="assets_mom/svg/ic-tab-home.svg" alt="">Главная</button>
    <button class="tab" data-tab="info"><img src="assets_mom/svg/ic-tab-info.svg" alt="">О проекте</button>
    <button class="tab" data-tab="support"><img src="assets_mom/svg/ic-tab-support.svg" alt="">Служба заботы</button>
  </nav>
  <img class="home-ind" src="assets_mom/svg/home-indicator.svg" alt="">

</main>
<script>
// ── Config — заменить на данные из API ────────────────────────────────
const APP = {
  pregnancyWeek: 24,
  tasksToday: 3,
  hasNotifications: true,
  userName: null,         // будет заменён именем из Telegram
};

// ── Telegram WebApp ───────────────────────────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  const firstName = tg.initDataUnsafe?.user?.first_name;
  if (firstName) APP.userName = firstName;
}

// ── Высота viewport (Telegram меняет её при открытии клавиатуры) ──────
function setViewportHeight() {
  const h = tg?.viewportHeight || window.innerHeight;
  document.documentElement.style.setProperty('--tg-vh', h + 'px');
}
setViewportHeight();
if (tg) tg.onEvent('viewportChanged', setViewportHeight);
else window.addEventListener('resize', setViewportHeight);

// ── Склонение числительных (рус.) ────────────────────────────────────
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

// ── Отрисовка динамических данных ────────────────────────────────────
function render() {
  if (APP.userName) {
    document.querySelector('[data-user-name]').textContent = APP.userName + '!';
  }

  const w = APP.pregnancyWeek;
  document.querySelector('[data-week]').textContent =
    w + ' ' + plural(w, 'неделя', 'недели', 'недель');

  const t = APP.tasksToday;
  document.querySelector('[data-tasks]').textContent =
    t + ' ' + plural(t, 'задача', 'задачи', 'задач') + ' на сегодня';

  document.querySelector('#btn-notifications .dot').style.display =
    APP.hasNotifications ? '' : 'none';
}
render();

// ── Переключение табов ────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.removeAttribute('aria-current'));
    tab.setAttribute('aria-current', 'page');
    // TODO: роутинг по tab.dataset.tab
  });
});

// ── Навигация по разделам ─────────────────────────────────────────────
document.querySelectorAll('[data-section]').forEach(card => {
  card.addEventListener('click', () => {
    // TODO: переход на экран section или tg.switchInlineQuery
    console.log('navigate:', card.dataset.section);
  });
});
</script>
</body>
</html>
