<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мама, что дальше?</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="screen">

  <!-- ===== ШАПКА ===== -->
  <header class="header">
    <!-- Облака -->
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
    <div class="cloud c5"></div>

    <!-- Топ-бар -->
    <div class="topbar">
      <div class="logo">
        <span>Мама,<br>что дальше?</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="stub('Уведомления')">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="white">
            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
          </svg>
          <span class="badge">3</span>
        </button>
        <button class="icon-btn" onclick="stub('Профиль')">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="white">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Герой -->
    <div class="hero">
      <div class="hero-text">
        <h1 class="greeting">Привет,<br>Анастасия!&nbsp;<span class="h">💜</span></h1>
        <button class="week-pill" onclick="stub('Неделя беременности')">
          <strong>24&nbsp;неделя</strong>&nbsp;беременности
          <svg viewBox="0 0 7 12" width="6" height="10" fill="none" style="margin-left:6px;flex-shrink:0">
            <path d="M1 1l5 5-5 5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="hero-sub">Мы рядом и подскажем,<br>что важно сделать сейчас&nbsp;💜</p>
      </div>

      <div class="hero-char">
        <p class="motiv">Ты<br>всё<br>можешь<br><span class="motiv-heart">♡</span></p>
        <!-- Персонаж-заглушка, заменить на <img src="assets/character.png"> -->
        <div class="char-wrap">
          <div class="char-body"></div>
          <div class="char-head"></div>
          <div class="char-hair"></div>
          <div class="char-belly"></div>
          <div class="char-arms"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== КОНТЕНТ ===== -->
  <div class="content">

    <!-- Карточка недели -->
    <button class="weekly" onclick="stub('Что важно на этой неделе?')">
      <div class="weekly-icon">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="#8B5ECC">
          <path d="M19 3h-1V1h-2v2H8V1H6v2H5C3.9 3 3 3.9 3 5v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
        </svg>
      </div>
      <div class="weekly-body">
        <div class="weekly-title">Что важно<br>на этой неделе?</div>
        <div class="weekly-sub">3 задачи на сегодня</div>
      </div>
      <svg class="chev" viewBox="0 0 7 12" width="7" height="12" fill="none">
        <path d="M1 1l5 5-5 5" stroke="#9B6ECC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- Сетка 2×4 -->
    <div class="grid">

      <!-- Беременность по неделям -->
      <button class="card" onclick="stub('Беременность по неделям')">
        <div class="ci">
          <svg viewBox="0 0 52 52">
            <rect width="52" height="52" rx="13" fill="#F9B8CC"/>
            <circle cx="26" cy="19" r="9" fill="rgba(255,255,255,0.82)"/>
            <ellipse cx="27" cy="36" rx="11" ry="10" fill="rgba(255,255,255,0.82)"/>
            <ellipse cx="23" cy="38" rx="5" ry="6" fill="rgba(255,255,255,0.5)"/>
          </svg>
        </div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Беременность<br>по неделям</span>
            <svg class="chev" viewBox="0 0 7 12" width="6" height="10" fill="none">
              <path d="M1 1l5 5-5 5" stroke="#C880B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="cs">Развитие, изменения<br>в тебе, рекомендации</span>
        </div>
      </button>

      <!-- Дневник беременности -->
      <button class="card" onclick="stub('Дневник беременности')">
        <div class="ci">
          <svg viewBox="0 0 52 52">
            <rect width="52" height="52" rx="13" fill="#F09ABB"/>
            <rect x="13" y="10" width="26" height="33" rx="4" fill="rgba(255,255,255,0.85)"/>
            <rect x="13" y="10" width="6" height="33" rx="3" fill="rgba(240,154,187,0.5)"/>
            <path d="M22 27 L26 23 L30 27 L26 31 Z" fill="#F09ABB" opacity="0.8"/>
            <line x1="21" y1="18" x2="35" y2="18" stroke="rgba(240,154,187,0.5)" stroke-width="1.5"/>
            <line x1="21" y1="22" x2="35" y2="22" stroke="rgba(240,154,187,0.5)" stroke-width="1.5"/>
            <line x1="21" y1="34" x2="35" y2="34" stroke="rgba(240,154,187,0.5)" stroke-width="1.5"/>
            <line x1="21" y1="38" x2="35" y2="38" stroke="rgba(240,154,187,0.5)" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Дневник<br>беременности</span>
            <svg class="chev" viewBox="0 0 7 12" width="6" height="10" fill="none">
              <path d="M1 1l5 5-5 5" stroke="#C880B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="cs">Записи, эмоции, фото<br>и важные события</span>
        </div>
      </button>

      <!-- Обследования -->
      <button class="card" onclick="stub('Обследования')">
        <div class="ci">
          <svg viewBox="0 0 52 52">
            <rect width="52" height="52" rx="13" fill="#72C4D8"/>
            <rect x="13" y="13" width="26" height="26" rx="6" fill="rgba(255,255,255,0.85)"/>
            <rect x="22" y="17" width="8" height="18" rx="3" fill="#72C4D8"/>
            <rect x="17" y="22" width="18" height="8" rx="3" fill="#72C4D8"/>
          </svg>
        </div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Обследования</span>
            <svg class="chev" viewBox="0 0 7 12" width="6" height="10" fill="none">
              <path d="M1 1l5 5-5 5" stroke="#72C4D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="cs">Анализы, УЗИ, приёмы<br>по сроку</span>
        </div>
      </button>

      <!-- Список покупок -->
      <button class="card" onclick="stub('Список покупок')">
        <div class="ci">
          <svg viewBox="0 0 52 52">
            <rect width="52" height="52" rx="13" fill="#F0A8C8"/>
            <path d="M16 22 Q15 20 17 20 L35 20 Q37 20 36 22 L38 40 Q38 42 36 42 L16 42 Q14 42 14 40 Z" fill="rgba(255,255,255,0.85)"/>
            <path d="M20 20 Q20 13 26 13 Q32 13 32 20" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M22 31 Q26 35 30 31" stroke="#F0A8C8" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Список покупок</span>
            <svg class="chev" viewBox="0 0 7 12" width="6" height="10" fill="none">
              <path d="M1 1l5 5-5 5" stroke="#C880B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="cs">Всё необходимое<br>для первых месяцев</span>
        </div>
      </button>

      <!-- Подготовка к родам -->
      <button class="card" onclick="stub('Подготовка к родам')">
        <div class="ci">
          <svg viewBox="0 0 52 52">
            <rect width="52" height="52" rx="13" fill="#E8C090"/>
            <rect x="12" y="23" width="28" height="21" rx="5" fill="rgba(255,255,255,0.85)"/>
            <path d="M18 23 L18 17 Q18 13 22 13 L30 13 Q34 13 34 17 L34 23" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <rect x="24" y="29" width="4" height="10" rx="1.5" fill="#E8C090" opacity="0.7"/>
            <rect x="21" y="32" width="10" height="4" rx="1.5" fill="#E8C090" opacity="0.7"/>
          </svg>
        </div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Подготовка<br>к родам</span>
            <svg class="chev" viewBox="0 0 7 12" width="6" height="10" fill="none">
              <path d="M1 1l5 5-5 5" stroke="#C8A070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="cs">Роддом, документы,<br>сумка, план родов</span>
        </div>
      </button>

      <!-- Полезные рекомендации -->
      <button class="card" onclick="stub('Полезные рекомендации')">
        <div class="ci">
          <svg viewBox="0 0 52 52">
            <rect width="52" height="52" rx="13" fill="#A090D8"/>
            <rect x="9" y="36" width="34" height="8" rx="3" fill="rgba(255,255,255,0.88)"/>
            <rect x="11" y="26" width="30" height="9" rx="3" fill="rgba(255,255,255,0.72)"/>
            <rect x="13" y="17" width="26" height="9" rx="3" fill="rgba(255,255,255,0.56)"/>
          </svg>
        </div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Полезные<br>рекомендации</span>
            <svg class="chev" viewBox="0 0 7 12" width="6" height="10" fill="none">
              <path d="M1 1l5 5-5 5" stroke="#9080C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="cs">Питание, самочувствие,<br>уход за собой и другое</span>
        </div>
      </button>

      <!-- Ассистент -->
      <button class="card" onclick="stub('Ассистент')">
        <div class="ci">
          <svg viewBox="0 0 52 52">
            <rect width="52" height="52" rx="13" fill="#78B8E8"/>
            <rect x="14" y="16" width="24" height="20" rx="6" fill="rgba(255,255,255,0.85)"/>
            <circle cx="21" cy="25" r="3" fill="#78B8E8"/>
            <circle cx="31" cy="25" r="3" fill="#78B8E8"/>
            <path d="M20 31 Q26 35 32 31" stroke="#78B8E8" stroke-width="2" fill="none" stroke-linecap="round"/>
            <line x1="26" y1="16" x2="26" y2="11" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="26" cy="9" r="2.5" fill="rgba(255,255,255,0.9)"/>
            <rect x="18" y="36" width="16" height="6" rx="3" fill="rgba(255,255,255,0.7)"/>
          </svg>
        </div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Ассистент</span>
            <svg class="chev" viewBox="0 0 7 12" width="6" height="10" fill="none">
              <path d="M1 1l5 5-5 5" stroke="#78B8E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="cs">Задай любой вопрос<br>о беременности</span>
        </div>
      </button>

      <!-- Профиль -->
      <button class="card" onclick="stub('Профиль')">
        <div class="ci">
          <svg viewBox="0 0 52 52">
            <rect width="52" height="52" rx="13" fill="#C0A0E0"/>
            <circle cx="26" cy="20" r="9" fill="rgba(255,255,255,0.85)"/>
            <path d="M10 44 Q10 33 26 33 Q42 33 42 44" fill="rgba(255,255,255,0.85)"/>
          </svg>
        </div>
        <div class="cb">
          <div class="ct-row">
            <span class="ct">Профиль</span>
            <svg class="chev" viewBox="0 0 7 12" width="6" height="10" fill="none">
              <path d="M1 1l5 5-5 5" stroke="#A080C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="cs">Твои данные,<br>настройки, подписка</span>
        </div>
      </button>

    </div>

    <!-- Баннер «Малыш родился!» -->
    <button class="baby-banner" onclick="stub('Малыш родился!')">
      <div class="baby-ava">
        <svg viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="28" fill="rgba(255,255,255,0.2)"/>
          <!-- упрощённый младенец в одеяльце -->
          <ellipse cx="28" cy="34" rx="18" ry="15" fill="rgba(255,255,255,0.85)"/>
          <circle cx="28" cy="20" r="11" fill="rgba(255,255,255,0.85)"/>
          <ellipse cx="28" cy="20" rx="7" ry="8" fill="#F9D0DC"/>
          <ellipse cx="26" cy="18" rx="3" ry="4" fill="#F7B8C8"/>
        </svg>
      </div>
      <div class="baby-text">
        <div class="baby-title">Малыш родился!</div>
        <div class="baby-sub">Расскажи нам о своём малыше,<br>чтобы получить новый план заботы</div>
      </div>
      <div class="baby-btn">
        <svg viewBox="0 0 7 12" width="7" height="12" fill="none">
          <path d="M1 1l5 5-5 5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </button>

    <div class="spacer"></div>
  </div>

  <!-- ===== НИЖНЯЯ НАВИГАЦИЯ ===== -->
  <nav class="bottom-nav">
    <button class="tab active">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span>Главная</span>
    </button>
    <button class="tab" onclick="stub('О проекте')">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
      </svg>
      <span>О проекте</span>
    </button>
    <button class="tab" onclick="stub('Служба заботы')">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M12 1C5.93 1 1 5.93 1 12v4c0 1.1.9 2 2 2h1c1.1 0 2-.9 2-2v-3c0-1.1-.9-2-2-2H3.07C3.56 7.19 7.38 4 12 4s8.44 3.19 8.93 7H20c-1.1 0-2 .9-2 2v3c0 1.1.9 2 2 2h1c1.1 0 2-.9 2-2v-4c0-6.07-4.93-11-11-11z"/>
      </svg>
      <span>Служба заботы</span>
    </button>
  </nav>

</main>

<!-- ===== ПОПАП-ЗАГЛУШКА ===== -->
<div class="overlay" id="overlay" onclick="closeStub()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-icon">🚧</div>
    <div class="modal-title">Раздел в разработке</div>
    <div class="modal-text" id="modalText"></div>
    <button class="modal-btn" onclick="closeStub()">Понятно</button>
  </div>
</div>

<script>
  if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  function stub(section) {
    if (window.Telegram?.WebApp?.showAlert) {
      window.Telegram.WebApp.showAlert('Раздел «' + section + '» скоро будет готов 🚧');
    } else {
      document.getElementById('modalText').textContent = '«' + section + '» скоро будет готов';
      document.getElementById('overlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
  }

  function closeStub() {
    document.getElementById('overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeStub(); });
</script>
</body>
</html>
